<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL path and redirects it to index.html with a query parameter
      var pathSegmentsToKeep = 1; // Keeps '/codespaces-blank/'

      var l = window.location;
      var route = l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') +
        '/?p=/' + route +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
